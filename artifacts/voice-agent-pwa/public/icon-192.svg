<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF7F1"/>
      <stop offset="100%" stop-color="#F1E9DA"/>
    </linearGradient>
    <linearGradient id="vl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9B6E8"/>
      <stop offset="28%" stop-color="#E879A8"/>
      <stop offset="58%" stop-color="#FF5A7E"/>
      <stop offset="82%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#F2A93D"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <!-- 7 pill bars centred on a 64x40 grid, scaled 2.4x and translated -->
  <g transform="translate(19.2 48) scale(2.4)">
    <rect x="2"  y="11" width="6" height="18" rx="3" fill="url(#vl)"/>
    <rect x="11" y="6"  width="6" height="28" rx="3" fill="url(#vl)"/>
    <rect x="20" y="1"  width="6" height="38" rx="3" fill="url(#vl)"/>
    <rect x="29" y="1"  width="6" height="38" rx="3" fill="url(#vl)"/>
    <rect x="38" y="6"  width="6" height="28" rx="3" fill="url(#vl)"/>
    <rect x="47" y="11" width="6" height="18" rx="3" fill="url(#vl)"/>
    <rect x="56" y="15" width="6" height="10" rx="3" fill="url(#vl)"/>
  </g>
</svg>
