<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VoyceLab" />
  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  <!-- iOS ignores SVG manifest icons; without a PNG apple-touch-icon the home-screen install shows a blank tile -->
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <title>VoyceLab — Voice surface</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Apply persisted theme before React renders to avoid flash, and keep the
    // status-bar theme-color in step so the splash doesn't flash a mismatched color
    (function() {
      var t = localStorage.getItem("voycelab_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", t === "dark" ? "#07080A" : "#FFFFFF");
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
